[project]
name = "history"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "garminconnect>=0.3.17",
    "matplotlib>=3.11.2",
    "numpy>=2.3.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "tqdm>=4.67.1",
]

# outils de qualité : ruff (lint + format) et mypy (types)
[dependency-groups]
dev = [
    "mypy>=2.4",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # la longueur des lignes est du ressort du formateur (« ruff format ») :
    # les chaînes de texte longs (messages du rapport) ne peuvent pas être coupées
    "E501",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["history.py", "analysis.py", "analysis_fine.py", "units.py"]
