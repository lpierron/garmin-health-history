name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check that the lock file is up to date
        run: uv lock --check

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check the formatting (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Type check (ty)
        run: uv run ty check .

      - name: Check that the scripts compile
        run: uv run python -m compileall -q history.py analysis.py analysis_fine.py units.py tests/make_fixtures.py tests/test_parsers.py

      - name: Check that the scripts import
        run: uv run python -c "import history, analysis, analysis_fine, units"

      - name: Run the unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Generate synthetic fixtures
        run: uv run python tests/make_fixtures.py --out fixtures

      - name: Smoke-test the weekly synthesis
        run: |
          uv run python -c "
          import json
          from history import synthese_semaine
          cache = json.load(open('fixtures/garmin_daily_cache.json'))
          out = synthese_semaine(cache)
          assert 'SYNTHÈSE DE LA SEMAINE' in out, out
          print(out)
          "

      - name: Run analysis.py
        run: uv run python analysis.py --csv fixtures/history.csv --out out

      - name: Run analysis_fine.py
        run: uv run python analysis_fine.py --cache fixtures/garmin_daily_cache.json --out out --shifts 20 --boot 20

      - name: Check the outputs
        run: |
          for f in correlations.csv correlations.png \
                   correlations_fine.csv correlations_weekly.png \
                   correlations_daily.png seasonality.png raw_vs_adjusted.png; do
            test -s "out/$f" || { echo "::error::out/$f manquant ou vide"; exit 1; }
          done
          echo "Tous les fichiers de sortie sont présents."

      # un cache sans les indicateurs optionnels (pas, sommeil, prédictions)
      # ne doit faire échouer aucun script
      - name: Generate partial fixtures
        run: uv run python tests/make_fixtures.py --out fixtures-partial --partial

      - name: Smoke-test the scripts on a partial cache
        run: |
          uv run python -c "
          import json
          from history import display_table, monthly, synthese_semaine
          cache = json.load(open('fixtures-partial/garmin_daily_cache.json'))
          table = display_table(monthly(cache))
          assert 'pred_5k' in table.columns, list(table.columns)
          print(synthese_semaine(cache))
          "
          uv run python analysis.py --csv fixtures-partial/history.csv --out out-partial
          uv run python analysis_fine.py --cache fixtures-partial/garmin_daily_cache.json --out out-partial --shifts 20 --boot 20

      - name: Check the outputs of the partial run
        run: |
          for f in correlations.csv correlations.png \
                   correlations_fine.csv correlations_weekly.png \
                   correlations_daily.png seasonality.png raw_vs_adjusted.png; do
            test -s "out-partial/$f" || { echo "::error::out-partial/$f manquant ou vide"; exit 1; }
          done
          echo "Tous les fichiers de sortie sont présents."
